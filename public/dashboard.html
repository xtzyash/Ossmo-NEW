<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Ossmo AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Default Crisp White & Black Theme + Dark Mode Support */
    :root {
      --bg-app: #ffffff;
      --bg-sidebar: #f8f8f9;
      --bg-surface: #ffffff;
      --bg-subtle: #f3f3f5;
      --bg-hover: #ededf0;
      --bg-user-bubble: #efeff1;
      --text-user-bubble: #0f0f10;
      --text-primary: #0f0f10;
      --text-secondary: #52525b;
      --text-muted: #8e8e96;
      --border: #e5e5ea;
      --border-strong: #d1d1d6;
      --accent: #0f0f10;
      --accent-inv: #ffffff;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-input: 0 8px 30px rgba(0, 0, 0, 0.06);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color-scheme: light;

      /* Category icon colours - light mode (darker shades so they stay visible on white) */
      --cat-food: #ea580c;
      --cat-groceries: #16a34a;
      --cat-transport: #2563eb;
      --cat-bills: #9333ea;
      --cat-shopping: #db2777;
      --cat-rent: #0d9488;
      --cat-entertainment: #d97706;
      --cat-investments: #4f46e5;
      --cat-other: #64748b;
    }

    body.dark-theme {
      --bg-app: #131314;
      --bg-sidebar: #0c0c0d;
      --bg-surface: #1c1c1e;
      --bg-subtle: #232326;
      --bg-hover: #27272a;
      --bg-user-bubble: #2a2a2e;
      --text-user-bubble: #f4f4f5;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: #262629;
      --border-strong: #3f3f46;
      --accent: #ffffff;
      --accent-inv: #0f0f10;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-input: 0 10px 35px rgba(0, 0, 0, 0.45);
      color-scheme: dark;

      /* Category icon colours - dark mode (lighter shades so they stay visible on dark) */
      --cat-food: #fb923c;
      --cat-groceries: #4ade80;
      --cat-transport: #60a5fa;
      --cat-bills: #c084fc;
      --cat-shopping: #f472b6;
      --cat-rent: #2dd4bf;
      --cat-entertainment: #fbbf24;
      --cat-investments: #818cf8;
      --cat-other: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ==========================================
       LEFT SIDEBAR (ChatGPT / Claude / Fiesta Style)
       ========================================== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 12px;
      transition: var(--transition);
      z-index: 20;
    }

    .sidebar.collapsed {
      margin-left: -260px;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    /* Brand Header Row with logo.svg */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-logo-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }

    .brand-fallback {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-inv);
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .header-icon-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* Primary Sidebar Navigation Items */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item {
      width: 100%;
      padding: 9px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.9;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-hover);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-badge {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Recent Chats History */
    .history-section {
      margin-top: 8px;
      overflow-y: auto;
      padding-right: 2px;
      flex: 1;
      min-height: 0;
      scrollbar-width: thin;
    }

    .history-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 10px 4px;
      letter-spacing: 0.02em;
    }

    .history-item {
      position: relative;
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: var(--transition);
    }

    .history-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chatHistoryList {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-item:hover,
    .history-item.menu-open {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .history-item.active {
      background: var(--bg-hover);
      color: var(--text-primary);
      font-weight: 500;
    }

    .history-more {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .history-more:hover { color: var(--text-primary); }

    .history-item:hover .history-more,
    .history-item.menu-open .history-more {
      display: inline-flex;
    }

    .history-item.renaming .history-more { display: none !important; }

    .history-rename {
      flex: 1;
      min-width: 0;
      height: 24px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 0 7px;
      outline: none;
    }

        /* Bottom Sidebar Card (Budget Status + User Profile) */
    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .budget-widget {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .budget-widget-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .budget-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .budget-bar {
      width: 100%;
      height: 5px;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .budget-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.35s ease;
    }

    .quick-exp-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--accent-inv);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
    }

    .quick-exp-btn:hover {
      opacity: 0.9;
    }

    .user-profile-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
    }

    .user-profile-bar:hover {
      background: var(--bg-hover);
    }

    .user-info-left {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow: hidden;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-inv);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-meta {
      overflow: hidden;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================
       MAIN WORKSPACE AREA
       ========================================== */
    .main-area {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-app);
    }

    /* Top Minimal Bar */
    .topbar {
      height: 54px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid transparent;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .view-pill-switch {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .view-pill {
      padding: 5px 13px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .view-pill.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-action-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .pill-action-btn:hover {
      background: var(--bg-subtle);
    }

    /* Views Container */
    .workspace-view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .workspace-view.active {
      display: flex;
    }

    /* ==========================================
       VIEW 1: AI CHAT INTERFACE
       ========================================== */
    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 140px;
    }

    .chat-thread {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    /* User Message Bubble (Right Aligned Pill) */
    .msg-user-row {
      display: flex;
      justify-content: flex-end;
    }

    .msg-user-bubble {
      background: var(--bg-user-bubble);
      color: var(--text-user-bubble);
      padding: 9px 14px;
      border-radius: 14px;
      max-width: 78%;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* AI Message Block (Left Aligned with Model Badge & Action Icons) */
    .msg-ai-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-model-header {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .ai-spark-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .msg-ai-content {
      font-size: 14.5px;
      line-height: 1.68;
      color: var(--text-primary);
    }

    .msg-ai-content p {
      margin-bottom: 10px;
    }

    .msg-ai-content ul {
      margin: 6px 0 12px 20px;
    }

    .msg-ai-content li {
      margin-bottom: 5px;
    }

    .msg-ai-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .msg-action-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .msg-action-icon:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    /* Quick Prompt Starter Chips */
    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .prompt-chip {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .prompt-chip:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    /* Bottom Floating Pill Input Bar */
    .chat-composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px 18px;
      background: linear-gradient(180deg, transparent 0%, var(--bg-app) 35%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-composer {
      width: 100%;
      max-width: 740px;
      min-height: 56px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 28px;
      padding: 8px 10px 8px 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "plus input actions";
      align-items: center;
      column-gap: 8px;
      row-gap: 4px;
      box-shadow: var(--shadow-input);
    }

    .chat-composer.multiline {
      grid-template-areas: "input input input" "plus . actions";
      padding: 14px 10px 8px 14px;
      align-items: end;
    }

    .composer-plus-btn {
      grid-area: plus;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .composer-plus-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .composer-input {
      grid-area: input;
      display: block;
      width: 100%;
      height: 22px;
      max-height: 160px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 22px;
      padding: 0 4px;
      resize: none;
      overflow-y: auto;
      outline: none;
    }

    .composer-input::placeholder {
      color: var(--text-muted);
    }

    .composer-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mode-wrap { position: relative; }

    .composer-mode-btn {
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      cursor: pointer;
    }

    .composer-mode-btn svg { color: var(--text-muted); }

    .mode-menu {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      min-width: 150px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 5px;
      box-shadow: var(--shadow-input);
      display: none;
      z-index: 40;
    }

    .mode-menu.open { display: block; }

    .mode-menu button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .mode-menu button:hover { background: var(--bg-subtle); }

    .composer-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .composer-icon-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .composer-icon-btn.listening {
      color: var(--danger);
      animation: micPulse 1.1s ease-in-out infinite;
    }

    @keyframes micPulse {
      0%, 100% { background: transparent; }
      50% { background: rgba(220, 38, 38, 0.12); }
    }

    .composer-send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--accent-inv);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .chat-composer.has-text .composer-send-btn { display: flex; }

    .composer-send-btn:hover { opacity: 0.85; }

    /* ==========================================
       VIEW 2: ANALYSIS & MONTHLY EXPENSE TABLE
       ========================================== */
    .analysis-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 60px;
    }

    .analysis-container {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .analysis-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .analysis-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .analysis-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .analysis-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Summary KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .kpi-val {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .kpi-note {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Manual Quick Add Row Form */
    .add-expense-bar {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 140px 1.6fr 150px 130px 130px auto;
      gap: 10px;
      align-items: center;
    }

    .table-input,
    .table-select {
      width: 100%;
      height: 36px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--border);

      font-size: 13px;
      outline: none;

    .btn-pill-black {

      border: none;
      background: var(--accent);
      color: var(--accent-inv);

      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .btn-pill-black:hover {
      opacity: 0.88;
    }

    .btn-pill-outline {
      height: 36px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;

      color: var(--accent-inv);
      border-color: var(--accent);
    }

    /* Monthly Ledger Table */
    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);

    .table-toolbar {
      padding: 13px 16px;

      align-items: center;
      gap: 8px;
    }

    .edit-mode-hint {
      font-size: 11.5px;
      font-weight: 500;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .expense-table-wrap {
      overflow-x: auto;
    }

    table.expense-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    table.expense-table th {
      padding: 11px 16px;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }

    table.expense-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);

    }

    table.expense-table tr:last-child td {
      border-bottom: none;
    }

    table.expense-table tbody tr:hover {
      background: var(--bg-subtle);
    }

    .cat-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);

    }

    .editable-cell {
      padding: 4px 7px;
      border-radius: 6px;
      border: 1px dashed transparent;

    }

    .edit-mode-on .editable-cell {
      border-color: var(--border-strong);

    }

    .edit-mode-on .editable-cell:focus {
      outline: none;
      border-style: solid;
      border-color: var(--text-primary);
      background: var(--bg-surface);
    }

    .row-delete-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      transition: var(--transition);
    }

    .row-delete-btn:hover {
      color: var(--danger);
      background: rgba(220, 38, 38, 0.08);
    }

    /* ==========================================
       SEARCH MODAL (Sidebar Search / Ctrl+K)
       ========================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
      z-index: 100;
    }

    .modal-backdrop.open {

    }

    .search-modal {
      width: 100%;
      max-width: 520px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: var(--shadow-input);
      overflow: hidden;
    }

    .search-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-modal-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
    }

    .search-results-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px;
    }

    .search-result-item {
      padding: 10px 12px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
    }

    .search-result-item:hover {

    }

    /* ==========================================
       NEW CHAT BUTTON, TOPBAR, RECENTS MENU
       ========================================== */
    .nav-item.new-chat-btn {
      background: var(--bg-hover);
      color: var(--text-primary);
      font-weight: 600;
      border-radius: 10px;
    }

    .nav-item.new-chat-btn:hover { background: var(--border); }

    .plus-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.6px solid currentColor;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-item .plus-circle svg {
      width: 11px;
      height: 11px;
      stroke-width: 2.6;
    }

    .topbar { height: 48px; }

    .topbar-open { display: none; }

    .sidebar.collapsed + .main-area .topbar-open { display: inline-flex; }

    .chat-menu {
      position: fixed;
      z-index: 120;
      min-width: 150px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 5px;
      box-shadow: var(--shadow-input);
      display: none;
    }

    .chat-menu.open { display: block; }

    .chat-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }

    .chat-menu button:hover { background: var(--bg-subtle); }
    .chat-menu button.danger { color: var(--danger); }
    .chat-menu button.danger:hover { background: rgba(220, 38, 38, 0.08); }

    /* ==========================================
       PROFILE POPUP (bottom of sidebar)
       ========================================== */
    .user-menu-wrap { position: relative; }

    .user-profile-bar.open { background: var(--bg-hover); }

    .user-profile-bar .chev { transition: transform 0.2s ease; color: var(--text-muted); flex-shrink: 0; }
    .user-profile-bar.open .chev { transform: rotate(180deg); }

    .profile-popup {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 8px);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: var(--shadow-input);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform-origin: bottom center;
      transform: translateY(12px);
      clip-path: inset(100% 0 0 0 round 16px);
      transition: clip-path 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.2s ease, visibility 0.34s;
      z-index: 40;
    }

    .profile-popup.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
      clip-path: inset(0 0 0 0 round 16px);
    }

    .pp-plan {
      padding: 14px 14px 12px;
      background: var(--bg-subtle);
      text-align: center;
    }

    .pp-plan-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .pp-pct { color: var(--text-muted); font-weight: 500; }

    .pp-plan-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin: 6px 0 10px;
    }

    .pp-bar {
      height: 5px;
      border-radius: 99px;
      background: var(--border-strong);
      overflow: hidden;
    }

    .pp-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.35s ease;
    }

    .pp-cta {
      width: 100%;
      border: none;
      background: var(--accent);
      color: var(--accent-inv);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pp-cta:hover { opacity: 0.9; }

    .pp-list { padding: 6px; }

    .pp-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 10px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13.5px;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
    }

    .pp-item:hover { background: var(--bg-hover); }
    .pp-item svg { width: 16px; height: 16px; color: var(--text-secondary); flex-shrink: 0; }
    .pp-item.danger, .pp-item.danger svg { color: var(--danger); }
    .pp-divider { height: 1px; background: var(--border); margin: 5px 4px; }

    /* ==========================================
       CHAT: THINKING SHIMMER + WORD-BY-WORD REVEAL
       ========================================== */
    .thinking-text {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      background: linear-gradient(90deg, var(--text-muted) 0%, var(--text-primary) 50%, var(--text-muted) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: thinkShimmer 1.6s linear infinite;
    }

    @keyframes thinkShimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    .w-hide, .blk-hide { display: none; }

    .w-in { animation: wordIn 0.5s ease both; }

    @keyframes wordIn {
      from { opacity: 0; filter: blur(6px); }
      to { opacity: 1; filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .w-in { animation: none; }
      .thinking-text { animation: none; }
    }

    .see-more-btn {
      display: block;
      margin-top: 4px;
      padding: 0;
      border: none;
      background: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .see-more-btn:hover { color: var(--text-primary); }

    /* Empty state (new chat): centered short greeting + composer */
    .empty-greeting {
      display: none;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 22px;
      text-align: center;
    }

    #view-chat.is-empty .chat-composer-wrap {
      top: 0;
      justify-content: center;
      padding-bottom: 10vh;
      background: none;
    }

    #view-chat.is-empty .empty-greeting { display: block; }

    /* Analysis: simple redesign */
    .analysis-container { max-width: 880px; gap: 22px; }
    .analysis-title { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
    .analysis-subtitle { font-size: 14px; }
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .kpi-card { padding: 18px 20px; border-radius: 16px; box-shadow: none; }
    .kpi-label { font-size: 13px; margin-bottom: 8px; }

    .kpi-val.neg { color: var(--danger); }
    .kpi-note { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
    .add-expense-bar {
      grid-template-columns: 138px 1fr 170px 120px auto;
      background: var(--bg-surface);
      border-radius: 16px;
      padding: 12px;
    }
    .table-card { border-radius: 16px; box-shadow: none; }
    table.expense-table th {
      text-transform: none;
      letter-spacing: 0;
      font-size: 12.5px;
      font-weight: 500;
      padding: 12px 16px;
    }
    table.expense-table td { padding: 8px 16px; }
    .cell-text, .cell-date, .cell-select {
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 8px;
      outline: none;
      transition: var(--transition);
    }
    .cell-date { width: 100%; }
    .cell-select { width: 100%; cursor: pointer; }
    .cell-text { display: block; min-width: 40px; cursor: text; }
    .cell-text:hover, .cell-date:hover, .cell-select:hover { background: var(--bg-subtle); }
    .cell-text:focus, .cell-date:focus, .cell-select:focus {
      background: var(--bg-surface);
      border-color: var(--text-primary);
    }
    td.amt { text-align: right; }
    td.amt .amt-wrap { display: inline-flex; align-items: center; font-weight: 600; }
    td.amt .cell-text { text-align: right; font-weight: 600; padding-left: 2px; }
    .table-hint { font-size: 12.5px; color: var(--text-muted); text-align: center; }
    .row-delete-btn { display: inline-flex; align-items: center; padding: 6px; }

    /* User row (sidebar bottom) */
    .user-profile-bar {
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }
    .user-profile-bar:hover, .user-profile-bar.open { background: var(--bg-hover); }
    .user-avatar { width: 30px; height: 30px; }
    .user-name { font-size: 13.5px; }

    /* Analysis: view / edit mode */
    .v-cell { display: block; padding: 6px 8px; font-size: 14px; }
    td.amt .v-cell { font-weight: 600; }
    .cell-text:empty::before { content: attr(data-ph); color: var(--text-muted); font-weight: 400; }
    .edit-on table.expense-table td { padding: 4px; border-right: 1px solid var(--border); }
    .edit-on table.expense-table td:last-child { border-right: none; }
    .edit-on .cell-text, .edit-on .cell-date, .edit-on .cell-select {
      background: var(--bg-surface);
      border-color: transparent;
    }
    .edit-on .cell-text:hover, .edit-on .cell-date:hover, .edit-on .cell-select:hover { background: var(--bg-subtle); }
    .edit-on .cell-text:focus, .edit-on .cell-date:focus, .edit-on .cell-select:focus {
      border-color: var(--text-primary);
      background: var(--bg-surface);
    }
    .btn-pill-outline.edit-active { background: var(--accent); color: var(--accent-inv); border-color: var(--accent); }
    @keyframes rowIn { from { background: var(--bg-hover); } to { background: transparent; } }
    .row-new { animation: rowIn 0.9s ease; }

    /* Table polish + custom dropdown + date picker */
    .table-card { background: var(--bg-surface); }
    table.expense-table th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 12px 16px;
    }
    table.expense-table td { padding: 10px 16px; font-variant-numeric: tabular-nums; }
    table.expense-table tbody tr { transition: background 0.15s ease; }
    table.expense-table tbody tr:hover { background: var(--bg-subtle); }
    .edit-on table.expense-table td { padding: 5px 6px; }
    .edit-on table.expense-table tbody tr:hover { background: transparent; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .cat-pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; font-size: 12.5px; }

      height: 20px;

</head>
<body>

              <span>Monthly Spend</span>

            id="chatInput"

              <button type="button" class="composer-mode-btn" onclick="toggleModeMenu(event)">

                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"></polyline></svg>

              <div class="mode-menu" id="modeMenu">
                <button type="button" onclick="setReplyMode('Auto')"><span>Auto</span><span data-check="Auto">✓</span></button>
                <button type="button" onclick="setReplyMode('Fast')"><span>Fast</span><span data-check="Fast"></span></button>
                <button type="button" onclick="setReplyMode('Thinking')"><span>Thinking</span><span data-check="Thinking"></span></button>

            </div>
            <button type="button" class="composer-icon-btn" id="composerMic" title="Voice input">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
            </button>
            <button type="submit" class="composer-send-btn" title="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </section>


    <!-- ==========================================
         WORKSPACE VIEW 2: ANALYSIS & MONTHLY TABLE
         ========================================== -->
    <section class="workspace-view" id="view-analysis">
      <div class="analysis-scroll-area">
        <div class="analysis-container">

          <div class="analysis-header">
            <div>
              <h1 class="analysis-title">My Expenses</h1>
              <p class="analysis-subtitle">Is mahine ka poora hisaab, ek jagah.</p>
            </div>
            <div class="analysis-controls">
              <button type="button" class="btn-pill-outline" id="editModeBtn" onclick="toggleTableEditMode()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>

              <button type="button" class="btn-pill-black" onclick="addNewRow()">+ Add</button>

          <!-- 3 simple numbers -->
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">Income</div>

              <div class="kpi-note">Is mahine ki kamaai</div>

            <div class="kpi-card">
              <div class="kpi-label">Spent</div>

              <div class="kpi-note" id="kpiTxCount">0 entries</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Left</div>
              <div class="kpi-val" id="kpiBalance">₹0</div>
              <div class="kpi-note" id="kpiSavingsRate">100% bacha hai</div>
            </div>
          </div>

          <!-- Simple table -->
          <div class="table-card" id="tableCardWrap">
            <div class="expense-table-wrap">
              <table class="expense-table">
                <thead>
                  <tr>
                    <th style="width: 175px;">Date</th>
                    <th>Item</th>
                    <th style="width: 200px;">Category</th>
                    <th style="width: 140px; text-align: right;">Amount</th>
                    <th style="width: 52px;"></th>
                  </tr>
                </thead>
                <tbody id="expenseTableBody"></tbody>
              </table>
