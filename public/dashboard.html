  <!-- ==========================================
       SEARCH MODAL (Ctrl+K)
       ========================================== -->
  <div class="modal-backdrop" id="searchModal" onclick="if(event.target===this) closeSearchModal()">
    <div class="search-modal">
      <div class="search-modal-header">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="globalSearchInput"
          class="search-modal-input"
          placeholder="Search any expense item, category, date, or command..."
          oninput="renderSearchResults(this.value)"
        />
        <button type="button" class="pill-action-btn" onclick="closeSearchModal()">ESC</button>
      </div>
      <div class="search-results-list" id="searchResultsList"></div>
    </div>
  </div>


  <!-- Floating popover (category menu / date picker) -->
  <div class="fpop" id="floatPop"></div>

  <!-- Recents context menu -->
  <div class="chat-menu" id="chatMenu">
    <button type="button" onclick="renameChatFromMenu()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      <span>Rename</span>
    </button>
    <button type="button" class="danger" onclick="deleteChatFromMenu()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
      <span>Delete</span>
    </button>
  </div>



  <!-- Markdown rendering for AI responses (checklists, tables, code blocks) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <!-- API config -->
  <script src="config.js"></script>

  <script>
    // ============================================================
    // OSSMO AI — Dashboard
    // All data goes through the Cloudflare Worker API.
    // No localStorage for user data — only theme preference.
    // ============================================================

    // ---------- Theme (only thing in localStorage) ----------
    (function applySavedTheme() {
      let t = null;
      try { t = localStorage.getItem('ossmo_theme'); } catch (err) {}
      document.body.classList.toggle('dark-theme', t === 'dark');
    })();

    // ---------- State ----------
    let userState = { id: '', email: '', name: '', profession: '', age: '', monthlyIncome: 0 };
    let expenses = [];
    let chats = [];
    let activeChatId = null;
    let isTableEditMode = false;
    let newRowId = null;
    let replying = false;
    let replyMode = 'Auto';
    let pendingAttachments = []; // {id, fileName, mimeType, previewUrl}
    let abortController = null;
    const THINK_MS = { Auto: 900, Fast: 350, Thinking: 1800 };

    const todayStr = (() => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    })();

    // ---------- API helpers ----------
    async function api(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        ...opts,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) {
        window.location.href = 'index.html';
        throw new Error('Unauthorized');
      }
      return res;
    }

    function escapeHTML(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ============================================================
    // 1. AUTH CHECK + INIT
    // ============================================================
    async function initDashboard() {
      try {
        const res = await api('/api/auth/me');
        const data = await res.json();
        if (!data.user) { window.location.href = 'index.html'; return; }
        if (!data.user.isOnboarded) { window.location.href = 'index.html'; return; }
        userState = data.user;
        document.getElementById('userNameDisplay').textContent = userState.name || 'User';
        document.getElementById('userRoleDisplay').textContent = userState.profession || 'Ossmo User';
        document.getElementById('userAvatar').textContent = (userState.name || 'U').charAt(0).toUpperCase();
        await loadExpenses();
        await loadChats();
        renderInitialChatGreeting();
      } catch (err) {
        console.error('Init error:', err);
        window.location.href = 'index.html';
      }
    }

    // ============================================================
    // 2. EXPENSES
    // ============================================================
    async function loadExpenses() {
      try {
        const res = await api('/api/expenses');
        const data = await res.json();
        expenses = data.expenses || [];
      } catch (err) {
        expenses = [];
      }
      updateAllMetricsAndUI();
    }

    async function saveExpenseToServer(expense) {
      const res = await api('/api/expenses', {
        method: 'POST',
        body: JSON.stringify(expense),
      });
      return res.json();
    }

    async function updateExpenseOnServer(id, patch) {
      const res = await api(`/api/expenses/${id}`, {
        method: 'PUT',
        body: JSON.stringify(patch),
      });
      return res.json();
    }

    async function deleteExpenseFromServer(id) {
      await api(`/api/expenses/${id}`, { method: 'DELETE' });
    }

    function getSummaryStats() {
      const totalSpent = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const remaining = userState.monthlyIncome - totalSpent;
      const usedPct = userState.monthlyIncome > 0
        ? Math.min(100, Math.round((totalSpent / userState.monthlyIncome) * 100))
        : 0;
      const byCat = {};
      expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount || 0); });
      let topCat = '—', topCatAmt = 0;
      Object.entries(byCat).forEach(([cat, amt]) => {
        if (amt > topCatAmt) { topCat = cat; topCatAmt = amt; }
      });
      return { totalSpent, remaining, usedPct, topCat, topCatAmt, byCat };
    }

    function updateAllMetricsAndUI(skipTable) {
      const { totalSpent, remaining, usedPct } = getSummaryStats();
      document.getElementById('sidebarWidgetPercent').textContent = `${usedPct}%`;
      document.getElementById('sidebarWidgetSub').textContent =
        `₹${totalSpent.toLocaleString('en-IN')} of ₹${userState.monthlyIncome.toLocaleString('en-IN')} used`;
      document.getElementById('sidebarBudgetFill').style.width = `${usedPct}%`;
      document.getElementById('kpiIncome').textContent = `₹${userState.monthlyIncome.toLocaleString('en-IN')}`;
      document.getElementById('kpiSpent').textContent = `₹${totalSpent.toLocaleString('en-IN')}`;
      document.getElementById('kpiTxCount').textContent = `${expenses.length} ${expenses.length === 1 ? 'entry' : 'entries'}`;
      const bal = document.getElementById('kpiBalance');
      bal.textContent = `₹${remaining.toLocaleString('en-IN')}`;
      bal.classList.toggle('neg', remaining < 0);
      document.getElementById('kpiSavingsRate').textContent = `${Math.max(0, 100 - usedPct)}% bacha hai`;
      if (!skipTable) renderExpenseTable();
    }

    // ============================================================
    // 3. EXPENSE TABLE (same UI as original)
    // ============================================================
    const EXPENSE_CATEGORIES = ['Food & Dining','Groceries','Transport & Fuel','Bills & Recharge','Shopping','Rent & Housing','Entertainment','Investments','Other'];

    function fmtDate(d) {
      const dt = new Date(d + 'T00:00:00');
      return isNaN(dt) ? d : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderExpenseTable() {
      const tbody = document.getElementById('expenseTableBody');
      if (expenses.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 36px; color: var(--text-muted);">Abhi koi kharcha nahi hai. Upar "+ Add" dabake pehla kharcha likho, ya chat mein Ossmo ko bolo.</td></tr>`;
        return;
      }
      const E = isTableEditMode;
      const enter = "if(event.key==='Enter'){event.preventDefault();";
      tbody.innerHTML = expenses.map(exp => `
        <tr class="${exp.id === newRowId ? 'row-new' : ''}">
          <td>${E
            ? `<input type="date" class="cell-date" value="${exp.date}" onchange="editField(${exp.id}, 'date', this.value)" />`
            : `<span class="v-cell">${fmtDate(exp.date)}</span>`}</td>
          <td>${E
            ? `<input type="text" class="cell-text" value="${escapeHTML(exp.item)}" onchange="editField(${exp.id}, 'item', this.value)" />`
            : `<span class="v-cell">${escapeHTML(exp.item)}${exp.source === 'ai' ? ' <span style="font-size:10px;color:var(--text-muted);background:var(--bg-subtle);padding:1px 5px;border-radius:4px;">AI</span>' : ''}</span>`}</td>
          <td>${E
            ? `<select class="cell-select" onchange="editField(${exp.id}, 'category', this.value)">${EXPENSE_CATEGORIES.map(c => `<option ${c === exp.category ? 'selected' : ''}>${c}</option>`).join('')}</select>`
            : `<span class="cat-view"><span class="dot" style="background:${catColor(exp.category)}"></span><span>${exp.category}</span></span>`}</td>
          <td class="amt">${E
            ? `<span class="amt-wrap"><span>₹</span><input type="number" class="cell-text" style="text-align:right;font-weight:600;" value="${exp.amount}" onchange="editField(${exp.id}, 'amount', Number(this.value))" /></span>`
            : `<span class="v-cell">₹ ${Number(exp.amount).toLocaleString('en-IN')}</span>`}</td>
          <td style="text-align: right;">${E ? `<button type="button" class="row-delete-btn" onclick="deleteExpenseRow(${exp.id})" title="Delete"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button>` : ''}</td>
        </tr>
      `).join('');
      newRowId = null;
    }

    function catColor(cat) {
      const map = {
        'Food & Dining': 'var(--cat-food)', 'Groceries': 'var(--cat-groceries)',
        'Transport & Fuel': 'var(--cat-transport)', 'Bills & Recharge': 'var(--cat-bills)',
        'Shopping': 'var(--cat-shopping)', 'Rent & Housing': 'var(--cat-rent)',
        'Entertainment': 'var(--cat-entertainment)', 'Investments': 'var(--cat-investments)',
        'Other': 'var(--cat-other)'
      };
      return map[cat] || 'var(--cat-other)';
    }

    async function editField(id, field, value) {
      await updateExpenseOnServer(id, { [field]: value });
      const target = expenses.find(e => e.id === id);
      if (target) target[field] = value;
      updateAllMetricsAndUI(true);
    }

    function setEditMode(on) {
      if (isTableEditMode === on) return;
      isTableEditMode = on;
      if (!on) {
        expenses = expenses.filter(e => e.item || Number(e.amount) > 0);
        expenses.forEach(e => { if (!e.item) e.item = 'Untitled'; });
        newRowId = null;
      }
      document.getElementById('tableCardWrap').classList.toggle('edit-on', on);
      document.getElementById('editModeBtn').classList.toggle('edit-active', on);
      document.getElementById('editModeLabel').textContent = on ? 'Done' : 'Edit';
      document.getElementById('tableHint').textContent = on
        ? 'Kisi bhi cell par click karke likho. Bahar click karne par auto-save ho jayega.'
        : 'Table badalne ke liye upar "Edit" dabao.';
      updateAllMetricsAndUI();
    }

    function toggleTableEditMode() { setEditMode(!isTableEditMode); }

    async function addNewRow() {
      switchView('analysis');
      if (!isTableEditMode) setEditMode(true);
      const id = Date.now();
      newRowId = id;
      try {
        const res = await saveExpenseToServer({
          date: todayStr, item: '', category: 'Other', mode: 'UPI', amount: 0, source: 'manual'
        });
        if (res.expense) {
          expenses.unshift(res.expense);
          newRowId = res.expense.id;
        }
      } catch (err) { /* ignore */ }
      updateAllMetricsAndUI();
    }

    async function deleteExpenseRow(id) {
      await deleteExpenseFromServer(id);
      expenses = expenses.filter(e => e.id !== id);
      updateAllMetricsAndUI();
    }

    // ============================================================
    // 4. AI CHAT — streaming via SSE from Worker
    // ============================================================
    function renderInitialChatGreeting() {
      const h = new Date().getHours();
      const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      const first = (userState.name || '').trim().split(/\s+/)[0] || 'there';
      document.getElementById('emptyGreeting').textContent = `${part}, ${first}`;
      document.getElementById('chatThread').innerHTML = '';
      document.getElementById('view-chat').classList.add('is-empty');
    }

    function quickAsk(text) {
      switchView('chat');
      const input = document.getElementById('chatInput');
      input.value = text;
      handleChatSubmit(new Event('submit'));
    }

    // ---------- Chat sessions ----------
    async function loadChats() {
      try {
        const res = await api('/api/chat/sessions');
        const data = await res.json();
        chats = data.sessions || [];
      } catch (err) { chats = []; }
      renderHistory();
    }

    function saveChats() { /* no-op — server is source of truth */ }

    function makeChatTitle(text) {
      const s = text.replace(/\s+/g, ' ').trim();
      return s.length > 50 ? s.slice(0, 50).trim() + '…' : s;
    }

    function renderHistory() {
      const list = document.getElementById('chatHistoryList');
      const label = document.getElementById('historyLabel');
      const inChat = document.getElementById('view-chat').classList.contains('active');
      label.style.display = chats.length ? '' : 'none';
      list.innerHTML = chats.map(c => `
        <div class="history-item ${inChat && c.id === activeChatId ? 'active' : ''}" data-id="${c.id}" onclick="openChat('${c.id}')">
          <span class="history-title">${escapeHTML(c.title)}</span>
          <button type="button" class="history-more" title="More" onclick="openChatMenu(event, '${c.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
          </button>
        </div>
      `).join('');
    }

    async function openChat(id) {
      try {
        const res = await api(`/api/chat/sessions/${id}`);
        const data = await res.json();
        if (!data.session) return;
        activeChatId = id;
        replying = false;
        switchView('chat');
        const thread = document.getElementById('chatThread');
        thread.innerHTML = '';
        document.getElementById('view-chat').classList.remove('is-empty');
        for (const m of (data.session.messages || [])) {
          if (m.role === 'user') appendUserMessage(m.content, m.attachments || []);
          else if (m.role === 'assistant') appendAIMessage(m.content, false);
        }
        renderHistory();
        scrollToChatBottom();
      } catch (err) { /* ignore */ }
    }

    let menuChatId = null;
    function openChatMenu(ev, id) {
      ev.stopPropagation();
      closeChatMenu();
      menuChatId = id;
      const btn = ev.currentTarget;
      btn.closest('.history-item').classList.add('menu-open');
      const menu = document.getElementById('chatMenu');
      const r = btn.getBoundingClientRect();
      menu.style.top = (r.bottom + 4) + 'px';
      menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 166)) + 'px';
      menu.classList.add('open');
    }

    function closeChatMenu() {
      document.getElementById('chatMenu').classList.remove('open');
      document.querySelectorAll('.history-item.menu-open').forEach(el => el.classList.remove('menu-open'));
    }

    async function renameChatFromMenu() {
      const id = menuChatId;
      closeChatMenu();
      const item = document.querySelector(`.history-item[data-id="${id}"]`);
      const chat = chats.find(c => c.id === id);
      if (!item || !chat) return;
      const titleEl = item.querySelector('.history-title');
      const inp = document.createElement('input');
      inp.className = 'history-rename';
      inp.value = chat.title;
      inp.maxLength = 80;
      item.classList.add('renaming');
      titleEl.replaceWith(inp);
      inp.addEventListener('click', e => e.stopPropagation());
      let done = false;
      const commit = async (save) => {
        if (done) return;
        done = true;
        if (save) {
          const v = inp.value.trim();
          if (v && v !== chat.title) {
            chat.title = v;
            await api(`/api/chat/sessions/${id}`, { method: 'PATCH', body: JSON.stringify({ title: v }) });
          }
        }
        renderHistory();
      };
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        else if (e.key === 'Escape') { e.stopPropagation(); commit(false); }
      });
      inp.addEventListener('blur', () => commit(true));
      inp.focus(); inp.select();
    }

    async function deleteChatFromMenu() {
      const id = menuChatId;
      closeChatMenu();
      await api(`/api/chat/sessions/${id}`, { method: 'DELETE' });
      chats = chats.filter(c => c.id !== id);
      if (activeChatId === id) startNewChat();
      else renderHistory();
    }

    // ---------- File attachment upload ----------
    async function handleFileSelect(files) {
      for (const file of files) {
        if (file.size > 8 * 1024 * 1024) {
          alert(`${file.name} is too large (max 8MB)`);
          continue;
        }
        const previewUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
        const tempId = 'temp-' + Date.now() + '-' + Math.random();
        pendingAttachments.push({ id: tempId, fileName: file.name, mimeType: file.type, previewUrl, uploading: true });
        renderPendingAttachments();
        try {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch(`${API_BASE}/api/chat/upload`, {
            method: 'POST',
            credentials: 'include',
            body: fd,
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Upload failed');
            pendingAttachments = pendingAttachments.filter(p => p.id !== tempId);
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            renderPendingAttachments();
            continue;
          }
          const idx = pendingAttachments.findIndex(p => p.id === tempId);
          if (idx >= 0) {
            pendingAttachments[idx] = { id: data.attachment.id, fileName: data.attachment.fileName, mimeType: data.attachment.mimeType, previewUrl, uploading: false };
          }
          renderPendingAttachments();
        } catch (err) {
          alert('Upload failed: ' + err.message);
          pendingAttachments = pendingAttachments.filter(p => p.id !== tempId);
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          renderPendingAttachments();
        }
      }
    }

    function renderPendingAttachments() {
      let bar = document.getElementById('pendingAttachments');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'pendingAttachments';
        bar.style.cssText = 'padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 6px;';
        document.querySelector('.chat-composer-wrap').insertBefore(bar, document.querySelector('.chat-composer-wrap').firstChild);
      }
      bar.innerHTML = pendingAttachments.map(p => `
        <div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;">
          ${p.previewUrl ? `<img src="${p.previewUrl}" style="width:20px;height:20px;border-radius:4px;object-fit:cover;" />` : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'}
          <span style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(p.fileName)}</span>
          ${p.uploading ? '<span style="color:var(--text-muted);">⏳</span>' : ''}
          <button onclick="removeAttachment('${p.id}')" style="border:none;background:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      `).join('');
      if (pendingAttachments.length === 0) bar.innerHTML = '';
    }

    function removeAttachment(id) {
      const p = pendingAttachments.find(x => x.id === id);
      if (p && p.previewUrl) URL.revokeObjectURL(p.previewUrl);
      pendingAttachments = pendingAttachments.filter(x => x.id !== id);
      renderPendingAttachments();
    }

    // ---------- Send message + stream response ----------
    async function handleChatSubmit(e) {
      e.preventDefault();
      if (replying) return;
      const input = document.getElementById('chatInput');
      const query = input.value.trim();
      const attachmentIds = pendingAttachments.filter(p => !p.uploading && !p.id.startsWith('temp-')).map(p => p.id);
      if (!query && attachmentIds.length === 0) return;

      // Clear pending attachments (they're now part of the message)
      const sentAttachments = [...pendingAttachments];
      pendingAttachments = [];
      renderPendingAttachments();

      document.getElementById('view-chat').classList.remove('is-empty');
      appendUserMessage(query || '(attachment only)', sentAttachments);
      resetComposer();
      replying = true;
      abortController = new AbortController();
      const thinking = showThinking();

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            sessionId: activeChatId,
            message: query,
            attachmentIds,
          }),
          signal: abortController.signal,
        });

        if (!res.ok || !res.body) {
          const errText = await res.text();
          throw new Error(errText || 'Chat request failed');
        }

        thinking.remove();
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let assistantText = '';
        let toolCallDiv = null;
        const aiContent = appendAIMessageContainer();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop() || '';
          for (const evt of events) {
            const lines = evt.split('\n');
            let eventType = '', dataStr = '';
            for (const ln of lines) {
              if (ln.startsWith('event: ')) eventType = ln.slice(7);
              else if (ln.startsWith('data: ')) dataStr = ln.slice(6);
            }
            if (!eventType) continue;
            let data = {}; try { data = JSON.parse(dataStr); } catch {}
            if (eventType === 'session') {
              if (data.sessionId && (!activeChatId || activeChatId !== data.sessionId)) {
                activeChatId = data.sessionId;
                loadChats();
              }
            } else if (eventType === 'token') {
              assistantText += data.text || '';
              aiContent.innerHTML = marked.parse(assistantText);
              scrollToChatBottom();
            } else if (eventType === 'tool_call' && data.tool && data.tool.name === 'log_expense') {
              if (!toolCallDiv) {
                toolCallDiv = document.createElement('div');
                toolCallDiv.style.cssText = 'display:inline-flex;align-items:center;gap:6px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;margin-top:6px;';
                toolCallDiv.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Logging expense…</span>';
                document.getElementById('chatThread').appendChild(toolCallDiv);
                scrollToChatBottom();
              }
            } else if (eventType === 'tool_result' && data.tool === 'log_expense') {
              if (toolCallDiv && data.expense) {
                toolCallDiv.querySelector('span').textContent = `Logged: ${data.expense.item} — ₹${data.expense.amount.toLocaleString('en-IN')} (${data.expense.category})`;
                loadExpenses(); // refresh table
              }
            } else if (eventType === 'error') {
              assistantText += `\n\n**Error:** ${data.error || 'Unknown error'}`;
              aiContent.innerHTML = marked.parse(assistantText);
            }
          }
        }
        if (toolCallDiv) toolCallDiv = null;
      } catch (err) {
        if (err.name === 'AbortError') { /* user stopped */ }
        else {
          thinking.remove();
          appendAIMessage(`**Error:** ${err.message}`, false);
        }
      } finally {
        replying = false;
        abortController = null;
      }
    }

    function showThinking() {
      const thread = document.getElementById('chatThread');
      const div = document.createElement('div');
      div.className = 'msg-ai-row';
      div.innerHTML = '<div class="thinking-text">Thinking</div>';
      thread.appendChild(div);
      scrollToChatBottom();
      return div;
    }

    function appendUserMessage(text, attachments) {
      const thread = document.getElementById('chatThread');
      const row = document.createElement('div');
      row.className = 'msg-user-row';
      const bubble = document.createElement('div');
      bubble.className = 'msg-user-bubble';
      let html = '';
      if (attachments && attachments.length > 0) {
        html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">';
        for (const a of attachments) {
          if (a.previewUrl) {
            html += `<img src="${a.previewUrl}" style="width:50px;height:50px;border-radius:6px;object-fit:cover;" />`;
          } else {
            html += `<span style="font-size:11px;background:var(--bg-surface);padding:2px 6px;border-radius:4px;">📎 ${escapeHTML(a.fileName)}</span>`;
          }
        }
        html += '</div>';
      }
      html += `<span>${escapeHTML(text)}</span>`;
      bubble.innerHTML = html;
      row.appendChild(bubble);
      thread.appendChild(row);
      scrollToChatBottom();
    }

    function appendAIMessageContainer() {
      const thread = document.getElementById('chatThread');
      const row = document.createElement('div');
      row.className = 'msg-ai-row';
      const header = document.createElement('div');
      header.className = 'ai-model-header';
      header.innerHTML = '<span class="ai-spark-dot"></span> Ossmo';
      const content = document.createElement('div');
      content.className = 'msg-ai-content';
      content.style.cssText = 'font-size:14.5px;line-height:1.68;';
      row.appendChild(header);
      row.appendChild(content);
      thread.appendChild(row);
      scrollToChatBottom();
      return content;
    }

    function appendAIMessage(markdownText, animate) {
      const content = appendAIMessageContainer();
      content.innerHTML = marked.parse(markdownText);
      scrollToChatBottom();
    }

    function startNewChat() {
      activeChatId = null;
      replying = false;
      if (abortController) abortController.abort();
      switchView('chat');
      renderInitialChatGreeting();
      renderHistory();
      document.getElementById('chatInput').focus();
    }

    // ============================================================
    // 5. NAVIGATION, THEME, COMPOSER
    // ============================================================
    function switchView(viewName) {
      const isChat = viewName === 'chat';
      document.getElementById('view-chat').classList.toggle('active', isChat);
      document.getElementById('view-analysis').classList.toggle('active', !isChat);
      document.getElementById('navAnalysis').classList.toggle('active', !isChat);
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('collapsed');
      renderHistory();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function toggleTheme() {
      const dark = document.body.classList.toggle('dark-theme');
      try { localStorage.setItem('ossmo_theme', dark ? 'dark' : 'light'); } catch (err) {}
    }

    function scrollToChatBottom() {
      const area = document.getElementById('chatScrollArea');
      area.scrollTop = area.scrollHeight;
    }

    // ---------- Profile popup, mode menu ----------
    function toggleProfileMenu(e) {
      if (e) e.stopPropagation();
      document.getElementById('profilePopup').classList.toggle('open');
      document.getElementById('userProfileBar').classList.toggle('open');
    }
    function closeProfileMenu() {
      document.getElementById('profilePopup').classList.remove('open');
      document.getElementById('userProfileBar').classList.remove('open');
    }
    function toggleModeMenu(e) {
      e.stopPropagation();
      document.getElementById('modeMenu').classList.toggle('open');
    }
    function setReplyMode(mode) {
      replyMode = mode;
      document.getElementById('composerModeLabel').textContent = mode;
      document.querySelectorAll('#modeMenu [data-check]').forEach(el => {
        el.textContent = el.getAttribute('data-check') === mode ? '✓' : '';
      });
      document.getElementById('modeMenu').classList.remove('open');
    }

    // ---------- Logout ----------
    async function logout() {
      try { await api('/api/auth/signout', { method: 'POST' }); } catch (err) {}
      window.location.href = 'index.html';
    }

    // ---------- Composer ----------
    function measureComposer() {
      const ta = document.getElementById('chatInput');
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
    }
    function syncComposer() {
      const form = document.getElementById('chatComposer');
      const ta = document.getElementById('chatInput');
      measureComposer();
      form.classList.toggle('has-text', ta.value.trim().length > 0);
      if (!ta.value) form.classList.remove('multiline');
      else if (ta.scrollHeight > 30) form.classList.add('multiline');
      measureComposer();
    }
    function resetComposer() {
      document.getElementById('chatInput').value = '';
      syncComposer();
    }
    function initComposer() {
      const form = document.getElementById('chatComposer');
      const ta = document.getElementById('chatInput');
      ta.addEventListener('input', syncComposer);
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      // Add file upload button next to plus button in composer
      const plusBtn = document.querySelector('.composer-plus-btn');
      if (plusBtn) {
        const fileBtn = document.createElement('button');
        fileBtn.type = 'button';
        fileBtn.className = 'composer-plus-btn';
        fileBtn.title = 'Attach receipt (image or PDF)';
        fileBtn.style.marginRight = '2px';
        fileBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>';
        fileBtn.onclick = () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.multiple = true;
          input.accept = 'image/*,application/pdf,text/plain,text/csv';
          input.onchange = () => handleFileSelect(input.files);
          input.click();
        };
        plusBtn.parentNode.insertBefore(fileBtn, plusBtn.nextSibling);
      }

      const mic = document.getElementById('composerMic');
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        if (mic) mic.style.display = 'none';
      } else {
        let rec = null, listening = false;
        const stopUI = () => { listening = false; if (mic) mic.classList.remove('listening'); };
        if (mic) mic.addEventListener('click', () => {
          if (listening && rec) { rec.stop(); return; }
          rec = new SR();
          rec.lang = 'en-IN';
          rec.interimResults = false;
          rec.continuous = false;
          rec.onresult = ev => {
            const t = Array.from(ev.results).map(r => r[0].transcript).join(' ');
            ta.value = (ta.value ? ta.value + ' ' : '') + t;
            syncComposer();
          };
          rec.onend = stopUI;
          rec.onerror = stopUI;
          rec.start();
          listening = true;
          mic.classList.add('listening');
        });
      }

      setReplyMode('Auto');
    }

    // ---------- Keyboard + global listeners ----------
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeSearchModal();
        closeProfileMenu();
        closeChatMenu();
        document.getElementById('modeMenu').classList.remove('open');
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.user-menu-wrap')) closeProfileMenu();
      if (!e.target.closest('#chatMenu')) closeChatMenu();
      if (!e.target.closest('.mode-wrap')) document.getElementById('modeMenu').classList.remove('open');
    });

    document.addEventListener('paste', (e) => {
      const cell = e.target.closest && e.target.closest('.cell-text');
      if (!cell) return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g, ' ');
      document.execCommand('insertText', false, text);
    });

    // ---------- Search modal ----------
    function openSearchModal() {
      const modal = document.getElementById('searchModal');
      modal.classList.add('open');
      const input = document.getElementById('globalSearchInput');
      input.value = '';
      renderSearchResults('');
      setTimeout(() => input.focus(), 50);
    }
    function closeSearchModal() {
      document.getElementById('searchModal').classList.remove('open');
    }
    function renderSearchResults(q) {
      const list = document.getElementById('searchResultsList');
      const clean = q.trim().toLowerCase();
      const matches = expenses.filter(e =>
        String(e.item || '').toLowerCase().includes(clean) ||
        String(e.category || '').toLowerCase().includes(clean) ||
        String(e.date || '').includes(clean) ||
        fmtDate(e.date).toLowerCase().includes(clean)
      );
      list.innerHTML = matches.map(m => `
        <div class="search-result-item" onclick="closeSearchModal(); switchView('analysis');">
          <div class="sr-left">
            <span class="dot" style="background:${catColor(m.category)};width:8px;height:8px;border-radius:50%;flex-shrink:0;"></span>
            <div style="min-width:0;">
              <strong>${escapeHTML(m.item || 'Untitled')}</strong>
              <div style="font-size:11.5px; color:var(--text-muted);">${fmtDate(m.date)} • ${escapeHTML(m.category)}</div>
            </div>
          </div>
          <div style="font-weight:600;">₹${Number(m.amount).toLocaleString('en-IN')}</div>
        </div>
      `).join('') || `<div style="padding:18px; text-align:center; color:var(--text-muted); font-size:13px;">No matching transactions found.</div>`;
    }

    // ---------- Mobile sidebar default ----------
    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('collapsed');

    // ---------- Start ----------
    initDashboard();
    initComposer();
  </script>
